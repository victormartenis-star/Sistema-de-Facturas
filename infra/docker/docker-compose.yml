# Desarrollo local: PostgreSQL 16
# Uso: docker compose -f infra/docker/docker-compose.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_dev
      # Collation determinista: los ORDER BY sobre nombres de proveedor deben
      # ordenar igual aquí, en el CI y en producción.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin esto, `up -d` devuelve el control antes de que la base acepte
    # conexiones y el `db:migrate` siguiente falla de forma intermitente.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
